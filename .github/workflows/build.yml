name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# creating a release needs write access to repository contents
permissions:
  contents: write

env:
  APP_VERSION: 1.5.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (0 warnings policy)
        run: dotnet build src/WinlyStart -c Release -warnaserror

      - name: Publish (framework-dependent)
        run: dotnet publish src/WinlyStart -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/fdd

      - name: Publish (self-contained)
        run: dotnet publish src/WinlyStart -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/sc

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" `
            "/DSourceExe=..\out\sc\WinlyStart.exe" `
            installer\WinlyStart.iss
          Get-ChildItem dist

      - name: Zip portable builds
        shell: pwsh
        run: |
          Compress-Archive -Path out/fdd/* -DestinationPath WinlyStart-win-x64.zip
          Compress-Archive -Path out/sc/*  -DestinationPath WinlyStart-win-x64-selfcontained.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WinlyStart
          path: |
            dist/*.exe
            WinlyStart-win-x64.zip
            WinlyStart-win-x64-selfcontained.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            WinlyStart-win-x64.zip
            WinlyStart-win-x64-selfcontained.zip
          generate_release_notes: true
